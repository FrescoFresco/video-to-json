services:
  app:
    build: .
    ports:
      - "43141:43141"
    environment:
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3}
      OCR_VLM: ${OCR_VLM:-1}
      HF_HOME: /data/hf
      XDG_CACHE_HOME: /data/cache
      HF_HUB_DISABLE_TELEMETRY: "1"
      VX_DATA_DIR: /data/jobs
      VX_DRIVE_OAUTH_CLIENT_ID: ${VX_DRIVE_OAUTH_CLIENT_ID:-}
      VX_DRIVE_OAUTH_CLIENT_SECRET: ${VX_DRIVE_OAUTH_CLIENT_SECRET:-}
    volumes:
      - vx-models:/data
    restart: unless-stopped

volumes:
  vx-models:
